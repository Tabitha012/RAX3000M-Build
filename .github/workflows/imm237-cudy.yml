name: RAX3000M Immwrt237-cudy
on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: cudy   # <--- 重点！就只改这几个字母
  NEW_LAN_IP: 192.168.6.1
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android 2>/dev/null
          sudo -E apt-get -y update
          sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo -E apt-get -y install $(curl -fsSL https://is.gd/depend_ubuntu2204_openwrt)
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          sudo timedatectl set-timezone "${TZ}"

      - name: 拉取源码
        run: |
          git clone -q --single-branch --depth=1 --branch=${REPO_BRANCH} ${REPO_URL} openwrt

      - name: 更新并安装 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 【手术室 1】修改默认 LAN IP
        run: |
          cd openwrt
          sed -i "s/192.168.1.1/${NEW_LAN_IP}/g" package/base-files/files/bin/config_generate

      - name: 注入灵魂 (加载你的 .config)
        run: |
          [ -e .config ] && mv .config openwrt/.config

      - name: 下载编译依赖包
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: 【手术室 2】修复 Rust 编译器 Bug
        run: |
          cd openwrt
          echo "提前解压并预处理 Rust 源码..."
          make package/feeds/packages/rust/host/prepare V=s || true
          echo "抹除 serde 包的 Cargo.toml.orig 校验记录，骗过防篡改机制..."
          find build_dir/ -type f -name ".cargo-checksum.json" -exec sed -i 's/"Cargo.toml.orig":"[^"]*",//g' {} + || true
          find build_dir/ -type f -name ".cargo-checksum.json" -exec sed -i 's/,"Cargo.toml.orig":"[^"]*"//g' {} + || true

      - name: 开启多核狂飙编译
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(($(nproc) + 1)) V=s || make -j1 || make -j1 V=s
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: 整理固件文件
        id: organize
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: 上传固件到 Artifacts
        uses: actions/upload-artifact@main
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: RAX3000M_ClosedSource_Firmware
          path: ${{ env.FIRMWARE }}
